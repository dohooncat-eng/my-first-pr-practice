<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등불지기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="게임 화면"></canvas>
<div id="safe-probe" aria-hidden="true"></div>
<button id="pause-btn" class="pause-btn" type="button" aria-label="일시정지" hidden>
  <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="5" y="4" width="3.2" height="12" rx="1" fill="currentColor"/><rect x="11.8" y="4" width="3.2" height="12" rx="1" fill="currentColor"/></svg>
</button>

<section id="screen-title" class="screen screen-title">
  <img class="title-art" src="assets/sprites/title_art.svg" alt="">
  <div class="title-shade" aria-hidden="true"></div>
  <div class="title-wrap">
    <p class="eyebrow">밤의 숲 생존 액션 · 목표 10:00</p>
    <h1 class="logo">등불지기</h1>
    <p class="lede">꺼지지 않는 등불 하나로 숲의 밤을 버티세요. 공격은 저절로 나갑니다. 당신은 피하고, 결정을 모으고, 강해지면 됩니다.</p>
    <div class="row">
      <button id="btn-start" class="btn btn-primary" type="button" disabled><span id="start-label">등불을 켜는 중</span><kbd>Enter</kbd></button>
    </div>
    <dl class="controls">
      <div><dt>이동</dt><dd>WASD · 방향키 · 화면 드래그</dd></div>
      <div><dt>일시정지</dt><dd>Esc</dd></div>
      <div><dt>레벨업</dt><dd>1 · 2 · 3 또는 클릭</dd></div>
    </dl>
    <p id="best" class="best" hidden><span class="best-label">최고 기록</span><span id="best-text"></span></p>
  </div>
</section>

<section id="screen-levelup" class="screen screen-levelup" hidden>
  <div class="lv-wrap">
    <header class="lv-head">
      <p class="eyebrow">레벨 업</p>
      <h2 class="lv-title">Lv <span id="lv-number">2</span></h2>
      <p class="lv-sub">하나를 골라 등불을 키우세요</p>
    </header>
    <div id="cards" class="cards"></div>
  </div>
</section>

<section id="screen-pause" class="screen screen-pause" hidden>
  <div class="panel">
    <p class="eyebrow">일시정지</p>
    <h2 class="panel-title">지금의 등불</h2>
    <ul id="build" class="build"></ul>
    <div class="row">
      <button id="btn-resume" class="btn btn-primary" type="button">계속하기 <kbd>Esc</kbd></button>
      <button id="btn-quit" class="btn btn-ghost" type="button">타이틀로</button>
    </div>
  </div>
</section>

<section id="screen-end" class="screen screen-end" hidden>
  <div class="panel end-panel">
    <p id="end-eyebrow" class="eyebrow"></p>
    <h2 id="end-title" class="end-title"></h2>
    <dl class="stats">
      <div><dt>버틴 시간</dt><dd id="end-time"></dd></div>
      <div><dt>레벨</dt><dd id="end-level"></dd></div>
      <div><dt>처치</dt><dd id="end-kills"></dd></div>
    </dl>
    <p id="end-best" class="end-best"></p>
    <div class="row">
      <button id="btn-retry" class="btn btn-primary" type="button">다시 하기 <kbd>Enter</kbd></button>
      <button id="btn-title" class="btn btn-ghost" type="button">타이틀로</button>
    </div>
  </div>
</section>

<script src="src/utils.js"></script>
<script src="src/input.js"></script>
<script src="src/sprites.js"></script>
<script src="src/effects.js"></script>
<script src="src/player.js"></script>
<script src="src/enemies.js"></script>
<script src="src/weapons.js"></script>
<script src="src/upgrades.js"></script>
<script src="src/spawner.js"></script>
<script src="src/pickups.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
